# beacon agent configuration.
# Precedence: defaults < this file < environment variables < command line flags.
# Copy to /etc/beacon/agent.yaml and adjust.

agent:
  # Stable identity used as the "host" label. Empty means: cloud instance id
  # when available, otherwise /etc/machine-id. Never use an IP here.
  host: ""

  # Roots are configurable so the agent can be exercised against fixtures.
  procfs: /proc
  sysfs: /sys

  # One-shot probe of the cloud metadata service at startup.
  metadata_probe: true

  intervals:
    fast: 5s     # CPU, memory, network
    normal: 15s  # disk I/O, PSI
    slow: 60s    # filesystem capacity, firewall, ports (M2)

  metrics:
    # The debug endpoint is loopback-only by design. The agent never listens
    # on a routable address.
    enabled: true
    listen: 127.0.0.1:9100

  # Store-and-forward buffer: survives restarts and network outages.
  state_dir: /var/lib/beacon
  heartbeat: 30s
  wal:
    max_bytes: 67108864      # 64 MiB
    segment_bytes: 1048576   # 1 MiB

transport:
  kind: http
  # Center endpoint, e.g. http://127.0.0.1:8080/api/v1/write
  # Empty means: collect and expose /metrics, but do not ship.
  endpoint: ""
  # Dialer: direct | system | tsnet | proxy | unix.
  # "system" transparently uses Tailscale when the host is in a tailnet.
  dial: direct
  proxy_url: ""
  token: ""
  timeout: 10s

log:
  level: info   # debug | info | warn | error
  format: text  # text | json
