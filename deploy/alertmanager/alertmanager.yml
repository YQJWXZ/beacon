global:
  resolve_timeout: 5m

# One receiver: the Feishu adapter inside beacon-server. Grouping keeps cards
# readable; the adapter adds its own dedupe and rate limit on top.
route:
  receiver: feishu
  group_by: [host, alertname]
  group_wait: 20s
  group_interval: 2m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="P0"']
      receiver: feishu
      repeat_interval: 1h

receivers:
  - name: feishu
    webhook_configs:
      - url: http://beacon-server:8080/hooks/alert
        send_resolved: true
        max_alerts: 10

# A dead host explains every other alert it produces. Silence them.
inhibit_rules:
  - source_matchers: ['alertname="BeaconAgentDown"']
    target_matchers: ['severity=~"P0|P1|P2"']
    equal: [host]
